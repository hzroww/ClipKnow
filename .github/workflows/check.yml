# 快检查：编译、测试、代码规范。每次 push 都跑。
name: 快检查

on:
  push:
    branches: [main]
  pull_request:

# 同一个分支连着推两次时，把上一次还在跑的取消掉。
# 不加这个的话，你连推三次就有三份在跑，看结果时不知道哪个是最新的。
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # runner 上预装了 rustup，但预装的 stable 不一定够新。
      # Cargo.toml 里写着 rust-version = "1.88"（代码用了 let-chains），
      # 装最新 stable 保证够。
      - name: 装 Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc --version

      # 编译产物存起来下次复用。不存的话每次都从零编几百个依赖，
      # 一次要五六分钟；存了之后只有依赖变了才重编。
      - name: 复用上次的编译产物
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Cargo.lock 变了就换一个新缓存（说明依赖变了）
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: 格式
        run: cargo fmt --check

      - name: clippy（警告当错误）
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: 测试
        run: cargo test --locked

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # ★ 用 go.mod 里声明的版本，而不是写死一个。
      #   这等于每次都在验证「go.mod 里那个门槛是真能编的」——
      #   之前 go.mod 写 1.27 把人挡在门外，就是这类问题。
      - name: 装 Go
        uses: actions/setup-go@v6
        with:
          go-version-file: web/go.mod
          cache-dependency-path: web/go.sum

      # gofmt -l 找到没格式化的文件时只把文件名打出来，**退出码仍然是 0**，
      # 直接用会被它骗过去，所以要自己判断输出非空。
      #
      # ★ 变量名必须是 ASCII。bash 的变量名只认字母数字下划线，
      #   写中文变量名会直接 command not found（第一次推上去就栽在这）。
      #   注释和 echo 的内容用中文没问题。
      - name: 格式
        working-directory: web
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "下面这些文件没格式化，本地跑 gofmt -w ."
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        working-directory: web
        run: go vet ./...

      - name: 编译
        working-directory: web
        run: go build ./...

  # 离线端到端：Go → Rust 子进程 → SSE → 数据库 → 读回历史。
  # 靠一个本地假模型服务器（httptest）做到不花钱、不联网。
  #
  # 单独一个 job 而不是塞进上面的 go：它要先编 Rust release，
  # 会把那个 15 秒的 job 拖成几分钟。分开就能和别人并行。
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 装 Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: 复用上次的编译产物
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # 测试里找的是 ../target/release/clipknow，找不到会 t.Skip 而不是失败。
      # 所以这一步必须真的成功，否则下面会"通过"但什么都没测。
      - name: 编 Rust
        run: cargo build --release --locked --bin clipknow

      - name: 确认二进制在
        run: test -x target/release/clipknow

      - uses: actions/setup-go@v6
        with:
          go-version-file: web/go.mod
          cache-dependency-path: web/go.sum

      # ★ -count=1 关掉测试缓存。
      #   Go 的缓存只看 Go 那边的输入，**Rust 二进制变了它不知道**——
      #   实测：改了 Rust 重跑，go test 直接返回 "ok (cached)"，
      #   而那份代码其实是坏的。CI 上更危险，缓存会跨提交复用。
      #
      # ★ -v 是故意的：这个测试只有一个，输出不多，
      #   而失败时能直接看到是哪条断言炸的，不用再点开一层。
      - name: 端到端
        working-directory: web
        run: go test -count=1 -v -run TestChatEndToEnd ./...
