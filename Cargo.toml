[package]
name = "clipknow"
version = "0.1.0"
edition = "2024"
# let-chains（if let Some(x) = a && cond）是 1.88 稳定的，
# edition 2024 本身也要 1.85+。声明出来，旧工具链会得到一句清楚的错，
# 而不是一堆看不懂的语法错误。
rust-version = "1.88"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.6", features = ["derive"] }
dotenvy = "0.15.7"
reqwest = { version = "0.13.4", features = ["blocking", "json", "multipart", "query"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustyline = "18.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
uuid = { version = "1.24.1", features = ["v7"] }
