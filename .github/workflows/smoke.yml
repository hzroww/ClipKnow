# 从零跑一遍：在一台干净机器上按 README 的 Docker 步骤起服务，
# 然后打几个 HTTP 请求确认它真的活着。
#
# 这个 workflow 是冲着一整类 bug 来的——「只在别人机器上出现」的那类。
# 已经踩过三个：
#   docker-compose 传空字符串环境变量 → 模型名为空，一提问就失败
#   全新安装库还没建表           → 会话列表直接 500
#   go.mod 门槛写太高            → 别人根本编不了
# 这三个在开发机上永远复现不了，因为开发机有 .env、有库、装了最新工具链。
#
# 不用真 key：这三个 bug 假 key 全都能抓到，它们是「服务起不起得来」层面的，
# 不是「模型答得对不对」层面的。后者归评测管。
name: 从零跑一遍

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    # ★ 假 key 要给**整个 job**，不能只给「起服务」那一步。
    #   docker-compose.yml 里那两个必填变量用的是 ${VAR:?...} 写法，
    #   而 compose 每次被调用都会解析整个文件——build、logs、down 全都会。
    #   只给 up 的话，第一步 build 就报「required variable ... is missing」。
    #   （第一次推上去就是栽在这里。）
    env:
      SCRAPECREATORS_API_KEY: ci-dummy
      DEEPSEEK_API_KEY: ci-dummy
    steps:
      - uses: actions/checkout@v5

      - name: 构建镜像
        run: docker compose build

      - name: 起服务
        run: docker compose up -d

      - name: 等它起来
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:3000/; then
              echo "第 ${i} 秒起来了"
              exit 0
            fi
            sleep 1
          done
          echo "30 秒还没起来，日志："
          docker compose logs
          exit 1

      # ★ 这一段里所有变量名和函数名都必须是 ASCII。
      #   bash 只认字母数字下划线，中文标识符会 command not found。
      #   注释和输出文本用中文没问题。
      - name: 检查各个接口
        run: |
          set -euo pipefail

          # 每个 curl 单独一行拿状态码，不要用管道——
          # 管道之后 $? 是最后一个命令的退出码，会把失败吃掉。
          code() { curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$@"; }
          expect() {  # expect <说明> <实际> <期望>
            if [ "$2" = "$3" ]; then
              echo "  OK  $1: $2"
            else
              echo "  FAIL  $1: 实际 $2，期望 $3"
              exit 1
            fi
          }

          expect "首页" "$(code http://localhost:3000/)" 200
          expect "未登录时的会话列表" "$(code http://localhost:3000/api/sessions)" 401
          expect "未登录时的身份" "$(code http://localhost:3000/api/me)" 401

          # 第一次启动会把邀请码打进日志
          invite=$(docker compose logs 2>&1 | grep -oE '邀请码：[A-Z0-9]{8}' | grep -oE '[A-Z0-9]{8}' | head -1)
          if [ -z "$invite" ]; then
            echo "FAIL 日志里没找到邀请码"
            docker compose logs
            exit 1
          fi
          echo "  拿到邀请码 $invite"

          expect "登录" \
            "$(code -c /tmp/jar -X POST http://localhost:3000/api/login \
                 -H 'Content-Type: application/json' -d "{\"code\":\"$invite\"}")" 200
          expect "错误的邀请码" \
            "$(code -X POST http://localhost:3000/api/login \
                 -H 'Content-Type: application/json' -d '{"code":"WRONGWRONG"}')" 401

          # ★ 这一条就是「全新安装 500」那个 bug 的护栏。
          #   库是空的、连表都还没建（建表在 Rust 子进程里，第一次提问才跑），
          #   Go 只读打开，正确行为是返回空列表而不是报错。
          expect "登录后的会话列表" "$(code -b /tmp/jar http://localhost:3000/api/sessions)" 200
          body=$(curl -s -b /tmp/jar --max-time 10 http://localhost:3000/api/sessions)
          expect "空库时会话列表的内容" "$body" "[]"

      - name: 日志里不该有这些
        run: |
          set -euo pipefail
          logs=$(docker compose logs 2>&1)
          for bad in "panic" "permission denied" "no such table" "unwrap"; do
            if echo "$logs" | grep -qi "$bad"; then
              echo "FAIL 日志里出现了「$bad」："
              echo "$logs" | grep -i -C2 "$bad"
              exit 1
            fi
          done
          echo "  OK  日志干净"

      # 前面任何一步失败时，把完整日志打出来——
      # 不然你在 CI 页面上只看到「失败了」，不知道为什么。
      - name: 失败时打印日志
        if: failure()
        run: docker compose logs

      - name: 收摊
        if: always()
        run: docker compose down -v
