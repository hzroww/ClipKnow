# 从零跑一遍：在一台干净机器上按 README 的 Docker 步骤起服务，
# 然后打几个 HTTP 请求确认它真的活着。
#
# 这个 workflow 是冲着一整类 bug 来的——「只在别人机器上出现」的那类。
# 已经踩过三个：
#   docker-compose 传空字符串环境变量 → 模型名为空，一提问就失败
#   全新安装库还没建表           → 会话列表直接 500
#   go.mod 门槛写太高            → 别人根本编不了
# 这三个在开发机上永远复现不了，因为开发机有 .env、有库、装了最新工具链。
#
# 不用真 key：这三个 bug 假 key 全都能抓到，它们是「服务起不起得来」层面的，
# 不是「模型答得对不对」层面的。后者归评测管。
name: 从零跑一遍

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    # ★ 假 key 要给**整个 job**，不能只给「起服务」那一步。
    #   docker-compose.yml 里那两个必填变量用的是 ${VAR:?...} 写法，
    #   而 compose 每次被调用都会解析整个文件——build、logs、down 全都会。
    #   只给 up 的话，第一步 build 就报「required variable ... is missing」。
    #   （第一次推上去就是栽在这里。）
    env:
      SCRAPECREATORS_API_KEY: ci-dummy
      DEEPSEEK_API_KEY: ci-dummy
      # Go 和 Rust 之间的内部凭证密钥。两个服务都读它，必须一致。
      # 至少 32 字符，短了两边都会拒绝启动。
      CLIPKNOW_INTERNAL_SECRET: ci-dummy-internal-secret-32-chars-ok
    steps:
      - uses: actions/checkout@v5

      - name: 构建镜像
        run: docker compose build

      - name: 起服务
        run: docker compose up -d

      # ★ 现在是**两个**服务：agent（Rust，常驻）和 web（Go）。
      #   web 的 depends_on 等的是 agent 的 healthcheck 变 healthy，
      #   所以这一步通过就已经证明了：agent 起来了、库迁移跑完了、
      #   /internal/health 能读到库。
      - name: 两个容器都得在跑
        run: |
          set -euo pipefail
          for svc in agent web; do
            state=$(docker compose ps --format '{{.State}}' "$svc")
            if [ "$state" != "running" ]; then
              echo "FAIL $svc 的状态是 $state，不是 running"
              docker compose logs "$svc"
              exit 1
            fi
            echo "  OK  $svc 在跑"
          done

      - name: 等它起来
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:3000/; then
              echo "第 ${i} 秒起来了"
              exit 0
            fi
            sleep 1
          done
          echo "30 秒还没起来，日志："
          docker compose logs
          exit 1

      # ★ 这一段里所有变量名和函数名都必须是 ASCII。
      #   bash 只认字母数字下划线，中文标识符会 command not found。
      #   注释和输出文本用中文没问题。
      - name: 检查各个接口
        run: |
          set -euo pipefail

          # 每个 curl 单独一行拿状态码，不要用管道——
          # 管道之后 $? 是最后一个命令的退出码，会把失败吃掉。
          code() { curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$@"; }
          expect() {  # expect <说明> <实际> <期望>
            if [ "$2" = "$3" ]; then
              echo "  OK  $1: $2"
            else
              echo "  FAIL  $1: 实际 $2，期望 $3"
              exit 1
            fi
          }

          expect "首页" "$(code http://localhost:3000/)" 200
          expect "未登录时的会话列表" "$(code http://localhost:3000/api/sessions)" 401
          expect "未登录时的身份" "$(code http://localhost:3000/api/me)" 401

          # 注册一个账号（第一版不限制谁能注册）
          reg='{"username":"smoketest","password":"password123"}'
          expect "注册" \
            "$(code -c /tmp/jar -X POST http://localhost:3000/api/register \
                 -H 'Content-Type: application/json' -d "$reg")" 200
          expect "重名注册" \
            "$(code -X POST http://localhost:3000/api/register \
                 -H 'Content-Type: application/json' -d "$reg")" 409
          expect "用密码登录" \
            "$(code -X POST http://localhost:3000/api/auth/login \
                 -H 'Content-Type: application/json' -d "$reg")" 200
          expect "密码错" \
            "$(code -X POST http://localhost:3000/api/auth/login \
                 -H 'Content-Type: application/json' \
                 -d '{"username":"smoketest","password":"wrongwrong"}')" 401

          # ★ 这一条就是「全新安装 500」那个 bug 的护栏。
          #   库是空的（一条会话都没有），正确行为是返回空列表而不是报错。
          #
          #   ★ 它现在**同时验证了跨服务这条链**：Go 收到请求 → 签内部凭证
          #     → HTTP 调 agent 的 /internal/sessions → agent 查库 → 回来。
          #     两边密钥配不一致、agent 没起、路径写错，这条都会红。
          expect "登录后的会话列表" "$(code -b /tmp/jar http://localhost:3000/api/sessions)" 200
          body=$(curl -s -b /tmp/jar --max-time 10 http://localhost:3000/api/sessions)
          expect "空库时会话列表的内容" "$body" "[]"

      # ★ agent 只在容器网络里监听，宿主和外网都不该碰得到。
      #   compose 里它没有 ports:，这一条是把那件事钉住——
      #   哪天有人手滑加上 ports，一个**不校验浏览器 Cookie、只认内部凭证**
      #   的服务就暴露到公网上了。
      - name: agent 不该对宿主开放
        run: |
          set -euo pipefail
          if curl -fsS -o /dev/null --max-time 5 http://localhost:3100/internal/health; then
            echo "FAIL agent 的 3100 端口被发布到宿主了"
            exit 1
          fi
          echo "  OK  宿主访问不到 agent"

      - name: 日志里不该有这些
        run: |
          set -euo pipefail
          logs=$(docker compose logs 2>&1)
          for bad in "panic" "permission denied" "no such table" "unwrap"; do
            if echo "$logs" | grep -qi "$bad"; then
              echo "FAIL 日志里出现了「$bad」："
              echo "$logs" | grep -i -C2 "$bad"
              exit 1
            fi
          done
          echo "  OK  日志干净"

      # 前面任何一步失败时，把完整日志打出来——
      # 不然你在 CI 页面上只看到「失败了」，不知道为什么。
      - name: 失败时打印日志
        if: failure()
        run: docker compose logs

      - name: 收摊
        if: always()
        run: docker compose down -v
